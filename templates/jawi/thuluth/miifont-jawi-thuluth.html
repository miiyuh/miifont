<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<text x="20" y="32" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#222">miifont · templat jawi · Thuluth</text>
<text x="20" y="40" font-family="Segoe UI, sans-serif" font-size="3.4" font-weight="normal" fill="#777">151 petak di 5 halaman · 151 cells on 5 pages · huruf panduan: Layla Thuluth, Mohammed Isam (OFL)</text>
<text x="20" y="54" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222">1.</text>
<text x="27" y="54" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222">Cetak pada A4, skala 100% (jangan 'fit to page').</text>
<text x="27" y="59" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777">Print on A4 at 100% scale (not 'fit to page').</text>
<text x="20" y="67" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222">2.</text>
<text x="27" y="67" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222">Guna pen hitam, mata sederhana. Satu huruf dalam setiap petak.</text>
<text x="27" y="72" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777">Use a black, medium-tip pen. One letter per cell.</text>
<text x="20" y="80" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222">3.</text>
<text x="27" y="80" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222">Huruf pudar ialah panduan: surih, atau tulis gaya sendiri di atasnya. Ia tidak akan diimbas.</text>
<text x="27" y="85" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777">The faint letter is a guide: trace it, or write your own way over it. It won't be scanned.</text>
<text x="20" y="93" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222">4.</text>
<text x="27" y="93" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222">Duduk di atas garis dasar (garis penuh). Garis putus-putus: tinggi badan huruf, alif, ekor.</text>
<text x="27" y="98" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777">Sit on the baseline (solid line). Dashed lines: body height, alif height, tail depth.</text>
<text x="20" y="106" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222">5.</text>
<text x="27" y="106" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222">Bila ada tanda |, sambung garisan di garis dasar tepat hingga ke tanda itu, jangan lebih.</text>
<text x="27" y="111" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777">Where there is a | tick, run the joining stroke along the baseline right up to it, no further.</text>
<text x="20" y="119" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222">6.</text>
<text x="27" y="119" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222">Saiz huruf yang sama di semua petak. Titik dan hamzah ditulis seperti biasa.</text>
<text x="27" y="124" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777">Keep the same letter size in every cell. Write dots and hamzah as you normally do.</text>
<text x="20" y="132" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222">7.</text>
<text x="27" y="132" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222">Petak 'pilihan' (angka Arab) boleh dibiarkan kosong.</text>
<text x="27" y="137" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777">Cells marked 'pilihan' (Arabic digits) are optional.</text>
