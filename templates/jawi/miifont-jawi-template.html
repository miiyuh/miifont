<!doctype html><html><head><meta charset='utf-8'><title>miifont jawi template</title><style>@page{size:A4;margin:0}html,body{margin:0;padding:0}svg{display:block;page-break-after:always}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<text x="20" y="32" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#222" text-anchor="start">miifont · templat jawi</text>
<text x="20" y="40" font-family="Segoe UI, sans-serif" font-size="3.6" font-weight="normal" fill="#777" text-anchor="start">151 petak di 5 halaman · 151 cells on 5 pages</text>
<text x="20" y="54" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222" text-anchor="start">1.</text>
<text x="27" y="54" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222" text-anchor="start">Cetak pada A4, skala 100% (jangan 'fit to page').</text>
<text x="27" y="59" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777" text-anchor="start">Print on A4 at 100% scale (not 'fit to page').</text>
<text x="20" y="67" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222" text-anchor="start">2.</text>
<text x="27" y="67" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222" text-anchor="start">Guna pen hitam, mata sederhana. Satu huruf dalam setiap petak.</text>
<text x="27" y="72" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777" text-anchor="start">Use a black, medium-tip pen. One letter per cell.</text>
<text x="20" y="80" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222" text-anchor="start">3.</text>
<text x="27" y="80" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222" text-anchor="start">Tulis bentuk yang ditunjukkan di penjuru kanan: tunggal, awal, tengah atau akhir.</text>
<text x="27" y="85" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777" text-anchor="start">Write the shape shown in the corner: isolated, initial, medial or final.</text>
<text x="20" y="93" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222" text-anchor="start">4.</text>
<text x="27" y="93" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222" text-anchor="start">Duduk di atas garis dasar (garis penuh). Garis putus-putus: tinggi badan huruf, alif, ekor.</text>
<text x="27" y="98" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777" text-anchor="start">Sit on the baseline (solid line). Dashed lines: body height, alif height, tail depth.</text>
<text x="20" y="106" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222" text-anchor="start">5.</text>
<text x="27" y="106" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222" text-anchor="start">Bila ada tanda |, sambung garisan di garis dasar tepat hingga ke tanda itu, jangan lebih.</text>
<text x="27" y="111" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777" text-anchor="start">Where there is a | tick, run the joining stroke along the baseline right up to it, no further.</text>
<text x="20" y="119" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222" text-anchor="start">6.</text>
<text x="27" y="119" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222" text-anchor="start">Saiz huruf yang sama di semua petak. Titik dan hamzah ditulis seperti biasa.</text>
<text x="27" y="124" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777" text-anchor="start">Keep the same letter size in every cell. Write dots and hamzah as you normally do.</text>
<text x="20" y="132" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222" text-anchor="start">7.</text>
<text x="27" y="132" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222" text-anchor="start">Petak 'pilihan' (angka Arab) boleh dibiarkan kosong.</text>
<text x="27" y="137" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777" text-anchor="start">Cells marked 'pilihan' (Arabic digits) are optional.</text>
<text x="20" y="145" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222" text-anchor="start">8.</text>
<text x="27" y="145" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222" text-anchor="start">Imbas setiap halaman pada 300 dpi, berwarna, seluruh halaman termasuk empat segi empat hitam.</text>
<text x="27" y="150" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777" text-anchor="start">Scan every page at 300 dpi in colour, the whole page including all four black squares.</text>
<text x="20" y="158" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="bold" fill="#222" text-anchor="start">9.</text>
<text x="27" y="158" font-family="Segoe UI, sans-serif" font-size="3.8" font-weight="normal" fill="#222" text-anchor="start">Halaman ini tidak perlu diimbas.</text>
<text x="27" y="163" font-family="Segoe UI, sans-serif" font-size="3.3" font-weight="normal" fill="#777" text-anchor="start">This page doesn't need to be scanned.</text>
<text x="20" y="177" font-family="Segoe UI, sans-serif" font-size="4.5" font-weight="bold" fill="#222" text-anchor="start">Contoh · example</text>
